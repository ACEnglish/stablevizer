[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pastri"
authors = [
    {name = "ACEnglish", email="acenglish@gmail.com"}
]
description = "Pattern Analysis of Somatic TR Instability"
readme = "README.md"
license = { text = "MIT" }
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "kmedoids>=0.5.5",
    "numpy>=1.24.4",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "matplotlib>=3.7.1",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "MiniSom>=2.3.6",
    "shapely==2.1.2",
    "pysam==0.24.0",
]

[project.scripts]
pastri = "pastri.__main__:main"

[project.urls]
Homepage = "https://github.com/ACEnglish/stablevizer"
Issues = "https://github.com/ACEnglish/stablevizer"

[tool.setuptools]
packages = ["pastri", "pastri.ksom"]
