[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stablevizer"
authors = [
    {name = "ACEnglish", email="acenglish@gmail.com"}
]
description = "TR instability visualization tools"
readme = "README.md"
license = { text = "MIT" }
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "kmedoids>=0.5.5",
    "numpy>=1.24.4",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "matplotlib>=3.7.1",
    "scikit-learn>=1.9.0",
]

[project.scripts]
stablevizer = "stablevizer.__main__:main"
ksomtr = "ksomtr.__main__:main"
smhtid = "smhtid.__main__:main"

[project.urls]
Homepage = "https://github.com/ACEnglish/stablevizer"
Issues = "https://github.com/ACEnglish/stablevizer"

[tool.setuptools.packages.find]
where = ["src"]
